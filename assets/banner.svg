<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0b1b30"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Dynamic Flow Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* CSS Keyframes for dynamic aspects */
    @keyframes pulseRing {
      0% { r: 100px; opacity: 0.4; }
      50% { r: 140px; opacity: 0.1; }
      100% { r: 100px; opacity: 0.4; }
    }
    @keyframes orbitFloat1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes orbitFloat2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes scanline {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes badgeGlow {
      0%, 100% { stroke: #38bdf8; stroke-opacity: 0.6; }
      50% { stroke: #34d399; stroke-opacity: 0.9; }
    }

    .pulse-ring {
      animation: pulseRing 5s ease-in-out infinite;
      transform-origin: 1040px 180px;
    }
    .badge-card-1 {
      animation: orbitFloat1 6s ease-in-out infinite;
    }
    .badge-card-2 {
      animation: orbitFloat2 7s ease-in-out infinite;
    }
    .scan-beam {
      animation: scanline 8s linear infinite;
    }
    .shield-stroke {
      animation: badgeGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)"/>

  <!-- Background Dynamic Ambient Rings (Safely behind text) -->
  <circle class="pulse-ring" cx="1040" cy="180" r="110" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
  <circle cx="1040" cy="180" r="160" fill="none" stroke="rgba(129, 140, 248, 0.12)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="1040" cy="180" r="70" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5"/>

  <!-- Animated Scanline along bottom border -->
  <g opacity="0.7">
    <rect class="scan-beam" y="357" width="400" height="3" fill="url(#beamGrad)"/>
  </g>

  <!-- Right Side Decorative Graphic: Trust Shield & Verification Flow -->
  <g transform="translate(1040, 180)">
    <!-- Glowing Shield Outer -->
    <path class="shield-stroke" d="M 0 -65 L 48 -40 L 48 15 C 48 48 0 72 0 72 C 0 72 -48 48 -48 15 L -48 -40 Z" 
          fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="3" filter="url(#shieldGlow)"/>
    <!-- Checkmark inside Shield -->
    <path d="M -16 2 L -5 14 L 18 -12" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Dynamic Tech Pills / Badges (Offset from text area) -->
  <g class="badge-card-1" transform="translate(860, 65)">
    <rect width="170" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="20" cy="21" r="5" fill="#34d399"/>
    <text x="36" y="26" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">SOC 2 TYPE II</text>
  </g>

  <g class="badge-card-2" transform="translate(880, 255)">
    <rect width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
    <text x="36" y="26" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">ISO 27001 • GRC</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, and Feature Highlights -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 75)">
    <rect width="265" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="18" y="20" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">🛡️ ENTERPRISE TRUST &amp; COMPLIANCE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(70, 145)">
    <text font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.8">
      Awesome Security &amp; Trust Center
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 190)">
    <text font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated platforms for security posture, compliance portals &amp; questionnaire automation
    </text>
  </g>

  <!-- Foreground Feature Pills -->
  <g transform="translate(70, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="175" height="36" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
      <text x="16" y="23" font-size="13" font-weight="600" fill="#f8fafc">🔒 Customer Trust Portals</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(190, 0)">
      <rect width="195" height="36" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
      <text x="16" y="23" font-size="13" font-weight="600" fill="#f8fafc">🤖 AI Questionnaire Engines</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="165" height="36" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
      <text x="16" y="23" font-size="13" font-weight="600" fill="#f8fafc">📊 Continuous GRC</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(70, 310)">
    <text font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
      COMMERCIAL SAAS LEADERS • ZERO-EGRESS LOCAL ENGINES • OPEN-SOURCE ALTERNATIVES
    </text>
  </g>
</svg>
